schema:
  schema_id: pdsp
  name: 拼读双拼
  version: 20260713
  author:
  description: 51声介，44韵调（+ong-eng）
  dependencies:

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  #- name: simplification
  #  states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - lua_processor@*llm_processor
    - lua_processor@*key_extra_processor
    - lua_processor@*word_length_split_processor
    - key_binder
    - lua_processor@*pin_fix_processor
    - speller
    - lua_processor@*no_match_clear_processor
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier
    - lua_filter@*hint_filter
    - lua_filter@*word_length_split_filter
    - lua_filter@*llm_filter
    - lua_filter@*pin_fix_filter
    #- simplifier

# LLM 候选重排配置（全部可选，省略则用 lua/cpp 内置默认值）
llm_rerank:
  min_code_len: 4
  max_tokens: 10
  max_candidates: 5
  # model_path: "d:/gguf_models/Qwen3.5-0.8B-Q4_K_M.gguf"  # 取消注释可指定模型路径，默认 Qwen3.5-0.8B Q4_K_M
  # cpu_cores: 7    # 取消注释可手动指定线程数，默认 7（实测多台机器均在 7 饱和）
  # backend: cpu    # 取消注释可指定后端，默认 cpu，可选 gpu，需对应 DLL 已部署

speller:
  #编码唯一自动上屏
  auto_select: false
  #超最大码长重新编码
  #auto_clear: max_length
  max_code_length: 4
  alphabet: 'abcdefghijklmnopqrstuvwxyz'
  delimiter: " "
  algebra:

translator:
  dictionary: pdsp
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: true
  enable_encoder: true
  enable_commit_history: true
  max_phrase_length: 5
  disable_user_dict_for_patterns:
    - '^.{1,3}$'
  preedit_format:
    - xform/.*//
  comment_format:
    - xform/.*//

key_binder:
  bindings:
    #comma period
    #[]翻页
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    #；次选
    - { when: has_menu, accept: semicolon, send: 2 }
    #退格当清屏用
    - { when: composing, accept: BackSpace, send: Escape }
    #固定首选（Ctrl+数字 / Tab，在 pin_fix_processor 中处理）
    - { when: has_menu, accept: Tab, send: Control+1 }

punctuator:
  import_preset: symbols_pd
  digit_separators: ""

recognizer:
  patterns:
    punct: '^\\([0-9][01]?|[A-Za-z]+)?$'
